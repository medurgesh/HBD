<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Raheesh! 🎉</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:linear-gradient(45deg,#ff6b6b,#4ecdc4);height:100vh;display:flex;align-items:center;justify-content:center}
        .card{background:white;border-radius:20px;padding:40px;max-width:500px;width:90%;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.3);animation:slide 1s ease-out}
        @keyframes slide{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
        h1{font-size:3em;color:#ff4757;margin-bottom:20px}
        p{font-size:1.2em;color:#333;line-height:1.6;margin-bottom:30px}
        button{background:linear-gradient(45deg,#ff6b6b,#ff8e8e);color:white;border:none;padding:15px 30px;font-size:1.1em;border-radius:30px;cursor:pointer;transition:all 0.3s}
        button:hover{transform:scale(1.05);box-shadow:0 10px 20px rgba(255,107,107,0.4)}
        .cake{width:150px;height:100px;margin:20px auto;position:relative;background:#d4a574;border-radius:10px}
        .candle{position:absolute;top:-20px;width:6px;height:25px;background:#f1c40f;border-radius:3px;left:20px}
        .candle:nth-child(2){left:50%}
        .candle:nth-child(3){left:80%}
        .flame{position:absolute;top:-5px;left:-1px;width:8px;height:8px;background:orange;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:flicker 0.5s infinite}
        @keyframes flicker{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
        .confetti{position:fixed;width:10px;height:10px;background:#ff6b6b;pointer-events:none;z-index:1000;animation:fall 3s linear infinite}
        @keyframes fall{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 Happy Birthday Raheesh! 🎂</h1>
        <p>Hey Raheesh!<br>You're the best friend ever!<br>Have an awesome day! 🥳✨</p>
        <div class="cake">
            <div class="candle"><div class="flame"></div></div>
            <div class="candle"><div class="flame"></div></div>
            <div class="candle"><div class="flame"></div></div>
        </div>
        <button onclick="partyTime()">Make a Wish Raheesh! ✨</button>
    </div>
    <script>
        function partyTime(){
            // Confetti explosion
            for(let i=0;i<100;i++){
                let conf = document.createElement('div');
                conf.className='confetti';
                conf.style.left=Math.random()*100+'vw';
                conf.style.background=['#ff6b6b','#4ecdc4','#45b7d1','#f9ca24'][Math.floor(Math.random()*4)];
                conf.style.animationDelay=Math.random()*1+'s';
                document.body.appendChild(conf);
                setTimeout(()=>conf.remove(),3500);
            }
            // Shake cake
            document.querySelector('.cake').style.animation='shake 0.5s';
        }
    </script>
</body>
</html>
